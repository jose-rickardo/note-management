<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Promotions - Listes des diplomes</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; color: #1f2933; }
    h1 { margin-bottom: 1.5rem; }
    table { border-collapse: collapse; width: 100%; max-width: 760px; }
    th, td { border: 1px solid #d7dbe0; padding: 0.6rem 0.9rem; text-align: left; }
    th { background: #f4f6f8; }
    a.btn { display: inline-block; padding: 0.35rem 0.8rem; background: #2563eb; color: white;
            text-decoration: none; border-radius: 4px; font-size: 0.9rem; }
    a.btn.disabled { background: #b6bec7; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Promotions</h1>
  <table>
    <thead>
      <tr>
        <th>Promotion</th>
        <th>Parcours</th>
        <th>Liste des diplomes</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="row : ${rows}">
        <td th:text="${row.promotionCode()}">PROMO-2026</td>
        <td th:text="${row.programCode()}">TN</td>
        <td>
          <a class="btn"
             th:classappend="${row.hasGraduates()} ? '' : 'disabled'"
             th:href="@{'/admin/promotions/' + ${row.promotionId()} + '/graduations/export'(programId=${row.programId()})}">
            Telecharger (XLSX)
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
