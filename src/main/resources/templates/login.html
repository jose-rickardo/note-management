<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Connexion admin</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center;
           height: 100vh; margin: 0; background: #f4f6f8; }
    .card { background: white; padding: 2rem 2.5rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            width: 320px; }
    h1 { font-size: 1.2rem; margin-bottom: 1.2rem; color: #1f2933; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #52606d; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #d7dbe0; border-radius: 4px;
            box-sizing: border-box; }
    button { width: 100%; padding: 0.6rem; background: #2563eb; color: white; border: none; border-radius: 4px;
             cursor: pointer; font-size: 0.95rem; }
    .error { color: #b91c1c; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connexion administrateur</h1>
    <p class="error" th:if="${param.error}">Email ou mot de passe incorrect.</p>
    <form method="post" th:action="@{/ui/login}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus />
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required />
      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
